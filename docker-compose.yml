services:
  label-studio:
    image: heartexlabs/label-studio:1.12.1
    container_name: mouse-label-studio
    ports:
      - "8080:8080"
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/
      - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=true
      - LABEL_STUDIO_USERNAME=user@example.com
      - LABEL_STUDIO_PASSWORD=password123
      - CSRF_TRUSTED_ORIGINS=http://localhost:8080 http://100.x.y.z:8080
    volumes:
      - ./label-studio_data:/label-studio/data
      - ./workspace/processed:/label-studio/files
      - ./workspace/raw:/label-studio/raw
    restart: unless-stopped

  processor:
    build: ./docker/processor
    container_name: mouse-processor
    ports:
      - "8501:8501"
    environment:
      - LABEL_STUDIO_USERNAME=user@example.com
      - LABEL_STUDIO_PASSWORD=password123
      # Set this to your Tailscale IP (e.g., http://100.x.y.z:8080) for remote access
      - LABEL_STUDIO_PUBLIC_URL=http://100.x.y.z:8080
    volumes:
      - ./workspace:/workspace
      - ./src:/app
      - ./label-studio_data:/label-studio-data:ro
    command: streamlit run app.py --server.address=0.0.0.0 --server.enableCORS=false --server.enableXsrfProtection=false
    restart: unless-stopped
